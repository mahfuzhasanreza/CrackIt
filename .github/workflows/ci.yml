name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy values so the app's env validation passes during build/test. Never real secrets.
  AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-real
  DATABASE_URL: postgresql://crackit:crackit@localhost:5434/crackit_test
  TEST_DATABASE_URL: postgresql://crackit:crackit@localhost:5434/crackit_test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall runs `prisma generate`
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage --project unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crackit
          POSTGRES_PASSWORD: crackit
          POSTGRES_DB: crackit_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U crackit -d crackit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply cleanly and match the schema
        run: |
          pnpm db:deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm test:int

  e2e:
    name: Build + E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crackit
          POSTGRES_PASSWORD: crackit
          POSTGRES_DB: crackit_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U crackit -d crackit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crackit
          POSTGRES_PASSWORD: crackit
          POSTGRES_DB: crackit_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U crackit -d crackit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          tags: crackit-migrate:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: crackit:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate, start and smoke test
        run: |
          docker run --rm --network host -e DATABASE_URL crackit-migrate:ci
          docker run -d --name app --network host -e DATABASE_URL -e AUTH_SECRET crackit:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | jq -e '.status == "ok" and .db == "up"'
          curl -fsS http://127.0.0.1:3000/login | grep -q "<form"
      - name: Container logs
        if: failure()
        run: docker logs app || true
