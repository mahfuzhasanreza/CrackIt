<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CrackIt</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --btn: #171717;
        --btn-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --btn: #fafafa;
          --btn-fg: #171717;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      img {
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.25rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.25rem;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        background: var(--btn);
        color: var(--btn-fg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>CrackIt needs a connection to load your data. Your running timer keeps counting on the server.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
